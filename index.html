<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Papan Agenda Kegiatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: only light;
  /* Warna identitas BIG & PPKIG */
  --navy:#0E2A66; --navy-2:#173F8F; --blue:#1A6FD1; --big-blue:#1477BA; --cyan:#35B4F0; --orange:#F39200;
  --bg:#EEF4FC; --card:#FFFFFF; --soft:#F3F7FD; --line:#E1E9F5;
  --text:#14244D; --muted:#5F6E91; --faint:#A7B3CC;
  --live:#14A06B; --live-bg:#E9F8F1; --live-line:#BDE8D4;
  --next:var(--blue); --next-bg:#EAF3FE; --next-line:#C5DCF8;
  --shadow:0 .1rem .25rem rgba(14,42,102,.05), 0 .8rem 2rem rgba(14,42,102,.08);
  --font:"Plus Jakarta Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --gutter:max(16px, 2rem);
}
html{font-size:max(8px, min(1.05vw, 1.95vh)); height:100%; background:var(--bg)}
body{margin:0; height:100%; color:var(--text); font-family:var(--font); font-variant-numeric:tabular-nums;
  overflow:hidden; line-height:1.35;
  background:
    url(bg-globe-biru.png) 58% -9rem / 22rem no-repeat,
    radial-gradient(ellipse 45% 30% at 62% 0%, rgba(53,180,240,.22), transparent 70%),
    radial-gradient(ellipse 40% 40% at 0% 100%, rgba(26,111,209,.16), transparent 70%),
    linear-gradient(180deg, #E4EEFB 0%, var(--bg) 30%)}
body.idle{cursor:none}
svg.i{width:1em; height:1em; flex:none; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.board{height:100%; box-sizing:border-box; display:grid; grid-template-rows:auto minmax(0, 1fr) auto;
  grid-template-columns:minmax(0, 1fr); grid-gap:1.1rem}

/* ============ Topbar ============ */
.top{display:grid; grid-template-columns:auto minmax(0, 1fr) auto auto; align-items:center; grid-gap:2.4rem;
  padding:1.3rem var(--gutter) 0 0}
.logos{display:grid; grid-auto-flow:column; align-items:center; grid-gap:1.4rem;
  background:var(--card); border-radius:0 1.4rem 1.4rem 0; padding:.9rem 1.8rem .9rem var(--gutter); box-shadow:var(--shadow)}
.logos img{height:4.6rem; width:auto; display:block}
.logos img + img{padding-left:1.4rem; border-left:1.5px solid var(--line)}
.eyebrow{display:none; font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; color:var(--big-blue); font-weight:700}
h1{font-size:2.35rem; line-height:1.1; margin:.15rem 0 .25rem; font-weight:800; color:var(--navy); letter-spacing:-.01em}
h1 .brand{color:var(--blue)}
h1 .brand i{font-style:normal; color:var(--orange)}
.loc{font-size:1.05rem; color:var(--muted); font-weight:500}
.loc::after{content:""; display:block; width:2.2rem; height:.22rem; margin-top:.55rem; border-radius:1rem;
  background:linear-gradient(90deg, var(--blue) 70%, transparent 70% 80%, var(--cyan) 80%)}
/* Sapaan sesuai waktu */
.sapa{display:grid; grid-template-columns:auto auto; align-items:center; grid-gap:.8rem; padding:.55rem 1.3rem .55rem .55rem;
  border-radius:3rem; background:rgba(255,255,255,.55); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85), 0 .4rem 1.2rem rgba(14,42,102,.07);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.sapa .ik{display:grid; place-items:center; width:2.8rem; height:2.8rem; border-radius:50%; color:#fff; font-size:1.45rem;
  background:linear-gradient(135deg, #FFB547, var(--orange)); box-shadow:0 .35rem .9rem rgba(243,146,0,.35)}
.sapa.malam .ik{background:linear-gradient(135deg, #4B5FB8, var(--navy)); box-shadow:0 .35rem .9rem rgba(14,42,102,.3)}
.sapa b{display:block; font-size:1.15rem; font-weight:800; color:var(--navy); line-height:1.15}
.sapa small{display:block; font-size:.8rem; font-weight:500; color:var(--muted); margin-top:.1rem}

/* Jam: ubin kalender + jam digital */
.clock{display:grid; grid-template-columns:auto auto; align-items:center; grid-gap:1.1rem}
.kal{position:relative; width:4.4rem; border-radius:.8rem; overflow:hidden; text-align:center;
  background:rgba(255,255,255,.55); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8), 0 .4rem 1.2rem rgba(14,42,102,.08);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.kal .hr{display:block; padding:.28rem 0 .22rem; font-size:.66rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:#fff; background:linear-gradient(90deg, var(--navy), var(--blue))}
.kal b{display:block; font-size:1.95rem; font-weight:800; line-height:1; color:var(--navy); margin-top:.3rem}
.kal small{display:block; font-size:.62rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:.15rem 0 .4rem}
.time{display:grid; grid-auto-flow:column; justify-content:start; align-items:center; grid-gap:.1rem;
  font-size:2.5rem; font-weight:800; line-height:1; letter-spacing:-.02em; color:var(--navy)}
.time i{font-style:normal; color:var(--blue); margin:0 .04em; position:relative; top:-.06em; animation:kedip 1s steps(1) infinite}
.time small{font-size:.36em; font-weight:800; letter-spacing:0; color:var(--blue); background:rgba(255,255,255,.6);
  border-radius:.5rem; padding:.3em .45em; margin-left:.45em; align-self:start; margin-top:.15em}
@keyframes kedip{50%{opacity:.25}}
.date{display:grid; grid-auto-flow:column; justify-content:start; align-items:center; grid-gap:.45rem;
  font-size:.85rem; font-weight:600; color:var(--muted); margin-top:.35rem}
.date::before{content:""; width:.5rem; height:.5rem; border-radius:50%; background:var(--orange)}

/* ============ Isi ============ */
.main{display:grid; grid-template-columns:minmax(0, .92fr) minmax(0, 1.8fr) minmax(0, 1.2fr); grid-gap:1.3rem;
  min-height:0; padding-inline:var(--gutter)}
.card{background:var(--card); border-radius:1.2rem; box-shadow:var(--shadow); min-height:0; overflow:hidden}
.head{display:grid; grid-template-columns:auto minmax(0, 1fr) auto; align-items:center; grid-gap:.9rem;
  padding:1.2rem 1.5rem 1rem; margin:0 1.5rem; padding-inline:0; border-bottom:1.5px solid var(--line); position:relative}
.head::after{content:""; position:absolute; left:0; bottom:-1.5px; width:3rem; height:3px; border-radius:2px; background:var(--blue)}
.head > svg.i{font-size:1.25rem; color:var(--blue); background:#EAF2FD; border-radius:.7rem; padding:.5rem; box-sizing:content-box}
.head h3{margin:0; font-size:1.1rem; font-weight:800; color:var(--navy); text-transform:uppercase; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.head h3 em{font-style:normal; color:var(--blue); margin:0 .4rem}
.head .aside{font-size:.9rem; font-weight:700; color:var(--blue); white-space:nowrap}
.dots{display:grid; grid-auto-flow:column; grid-gap:.4rem}
.dots i{width:.55rem; height:.55rem; border-radius:50%; background:var(--line)}
.dots i.on{background:var(--blue); width:1.3rem; border-radius:1rem}

/* Kolom kiri: sorotan */
.now{position:relative; overflow:hidden; border-radius:1.2rem; color:#fff; box-shadow:0 1rem 2.4rem rgba(14,42,102,.25);
  display:grid; grid-template-rows:minmax(0, 1fr) auto; background:linear-gradient(165deg, #0B3A8E 0%, #1454B8 55%, #1A6FD1 100%)}
.now.is-next{background:linear-gradient(165deg, #1454B8 0%, #1A6FD1 50%, #35A6EA 100%)}
.now.empty{background:linear-gradient(165deg, #33456E, #5B6D96)}
.earth{position:absolute; right:-6rem; bottom:1.5rem; width:19rem; height:19rem; pointer-events:none; opacity:.95}
.feature{position:relative; padding:1.5rem 1.5rem 1rem; display:grid; align-content:start; grid-gap:.75rem; min-height:0}
.now .feature .tag{justify-self:start; color:#fff; background:rgba(255,255,255,.2)}
.now .feature .tag.live{background:#14A06B; box-shadow:0 .3rem .8rem rgba(8,60,40,.3)}
.now .feature .tag.live::before{background:#fff; box-shadow:0 0 0 .2rem rgba(255,255,255,.3)}
.shd{display:flex; align-items:center; justify-content:space-between; gap:.8rem}
.sdots{display:flex; gap:.3rem}
.sdots i{width:.45rem; height:.45rem; border-radius:1rem; background:rgba(255,255,255,.35); transition:width .3s}
.sdots i.on{width:1.3rem; background:#fff}
.feature.ganti > *{animation:sorotMasuk .6s ease both}
.feature.ganti > *:nth-child(2){animation-delay:.05s}
.feature.ganti > *:nth-child(3){animation-delay:.1s}
.feature.ganti > *:nth-child(n+4){animation-delay:.15s}
@keyframes sorotMasuk{from{opacity:0; transform:translateY(.5rem)}}
.fjam{font-size:2.5rem; font-weight:800; line-height:1.05; letter-spacing:-.01em; margin-top:.35rem; white-space:nowrap}
.fjam small{display:block; font-size:.95rem; font-weight:500; opacity:.85; margin-top:.2rem; letter-spacing:0; white-space:normal}
.feature h2{font-size:1.75rem; line-height:1.18; margin:.3rem 0 0; font-weight:800; letter-spacing:-.01em;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; line-clamp:4; overflow:hidden; overflow-wrap:anywhere}
.meta{display:grid; grid-gap:.8rem; margin-top:.3rem; padding-top:1rem; border-top:1px solid rgba(255,255,255,.2)}
.mi{display:grid; grid-template-columns:2.3rem minmax(0, 1fr); grid-gap:.8rem; align-items:center}
.mi > i{display:grid; place-items:center; width:2.3rem; height:2.3rem; border-radius:50%; background:rgba(255,255,255,.92); color:var(--blue); font-size:1.15rem}
.mi small{display:block; font-size:.7rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.75}
.mi b{display:block; font-size:1.02rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar{height:.45rem; background:rgba(255,255,255,.22); border-radius:1rem; overflow:hidden}
.bar i{display:block; height:100%; background:#fff; border-radius:1rem; transition:width 1s linear}
.stats{position:relative; display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); grid-gap:.65rem; padding:0 .8rem .8rem}
.stat{background:rgba(255,255,255,.96); color:var(--text); border-radius:1rem; padding:.8rem .85rem .75rem; box-shadow:0 .6rem 1.4rem rgba(6,30,80,.22)}
.stat svg.i{font-size:1.1rem; color:var(--blue); background:#EAF2FD; border-radius:.6rem; padding:.4rem; box-sizing:content-box}
.stat b{display:block; font-size:2rem; font-weight:800; line-height:1; margin-top:.55rem; color:var(--navy)}
.stat span{display:block; font-size:.8rem; font-weight:500; color:var(--muted); margin-top:.3rem; line-height:1.2}

/* Label status: warna lembut, bukan blok penuh */
.tag{display:inline-grid; grid-auto-flow:column; align-items:center; grid-gap:.4rem; font-size:.72rem; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; padding:.34rem .75rem; border-radius:2rem; white-space:nowrap}
.tag.live{background:#DDF5EA; color:#0B7F52}
.tag.next{background:#E3EEFD; color:var(--blue)}
.tag.done{background:#EFF2F7; color:var(--muted)}
.tag.live::before{content:""; width:.45rem; height:.45rem; border-radius:50%; background:var(--live);
  box-shadow:0 0 0 .2rem rgba(20,160,107,.2); animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* Kolom tengah: daftar kartu kegiatan hari ini */
.col-today{display:grid; grid-template-rows:auto minmax(0, 1fr)}
.rows{overflow:hidden; min-height:0; padding:1.1rem 1.5rem .9rem; display:grid; grid-auto-rows:max-content; grid-gap:.75rem}
.row{position:relative; display:grid; grid-template-columns:5.2rem 2.9rem minmax(0, 1fr); grid-gap:0 1.1rem; align-items:center;
  padding:.95rem 1.2rem .95rem 1.1rem; border-radius:1.1rem; background:var(--card);
  box-shadow:0 .1rem .2rem rgba(14,42,102,.04), 0 .5rem 1.4rem rgba(14,42,102,.07), inset 0 0 0 1px #EDF2F9;
  animation:rowin .5s ease both}
.row::before{content:""; position:absolute; left:0; top:1rem; bottom:1rem; width:.28rem; border-radius:0 .3rem .3rem 0; background:var(--line)}
.tm{align-self:stretch; display:grid; align-content:center; padding-right:1rem; border-right:1.5px solid var(--line)}
.tm b{font-size:1.5rem; font-weight:800; line-height:1; color:var(--navy); letter-spacing:-.01em}
.tm span{font-size:.8rem; font-weight:600; color:var(--muted); margin-top:.3rem; white-space:nowrap}
.tm b.all{font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--blue)}
.ico{position:relative; display:grid; place-items:center; width:2.9rem; height:2.9rem; border-radius:.9rem; color:var(--c, var(--blue)); font-size:1.35rem}
.ico::before{content:""; position:absolute; top:0; right:0; bottom:0; left:0; border-radius:inherit; background:var(--c, var(--blue)); opacity:.13}
.ico svg{position:relative}
.bd{min-width:0}
.hd{display:grid; grid-template-columns:minmax(0, 1fr) auto; grid-gap:1rem; align-items:start}
.ti{font-weight:800; font-size:1.1rem; line-height:1.28; color:var(--navy);
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden; overflow-wrap:anywhere}
.lns{display:flex; flex-wrap:wrap; gap:.25rem 1.4rem; margin-top:.4rem; min-width:0}
.ln{display:grid; grid-template-columns:auto minmax(0, 1fr); align-items:center; grid-gap:.4rem;
  font-size:.88rem; color:var(--muted); font-weight:500; min-width:0; max-width:24rem}
.ln svg.i{font-size:.95rem; color:var(--faint)}
.ln span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row.live{background:linear-gradient(90deg, #F0FBF6, #fff 70%)}
.row.live::before{background:var(--live)}
.row.live .tm b{color:#0B7F52}
.row.next::before{background:var(--blue)}
.row.next{background:linear-gradient(90deg, #F1F6FE, #fff 70%)}
.row.done{opacity:.5; box-shadow:inset 0 0 0 1px #EDF2F9}
@keyframes rowin{from{opacity:0; transform:translateY(.4rem)}}
.row.done{animation-name:rowin-done}
@keyframes rowin-done{from{opacity:0}}
.kosong{display:grid; justify-items:center; align-content:center; grid-gap:.9rem; padding:1.5rem 0 .5rem; color:var(--muted);
  font-size:1rem; font-weight:500; text-align:center; min-height:0}
.kosong svg{width:10rem; height:auto; opacity:.9}

/* Kolom kanan: mendatang */
.col-next{display:grid; grid-template-rows:auto minmax(0, 1fr) auto}
.days{overflow:hidden; min-height:0; padding:.5rem 1.5rem 0;
  -webkit-mask-image:linear-gradient(#000 92%, transparent); mask-image:linear-gradient(#000 92%, transparent)}
.up{display:grid; grid-template-columns:3.2rem minmax(0, 1fr); grid-gap:1rem; align-items:center; padding:.55rem 0}
.up + .up:not(.sama){border-top:1px solid var(--line)}
.up.sama{padding-top:0}
.up.sama .dbadge{visibility:hidden}
.upb{min-width:0}
.upm{display:grid; grid-auto-flow:column; justify-content:start; align-items:center; grid-gap:.5rem; margin-bottom:.12rem;
  font-size:.8rem; font-weight:700; color:var(--muted)}
.upm .jm{display:grid; grid-auto-flow:column; align-items:center; grid-gap:.25rem; color:var(--blue); font-weight:800}
.upm .jm svg.i{font-size:.9rem}
.upm .jm.all{font-size:.7rem; letter-spacing:.08em}
.upm .hari::before{content:"·"; margin-right:.5rem; color:var(--faint)}
.up .ti{font-size:.98rem; font-weight:700; color:var(--text); -webkit-line-clamp:1; line-clamp:1}
.up .sub{color:var(--muted); font-size:.8rem; margin-top:.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dbadge{align-self:center; border-radius:.85rem; text-align:center; padding:.42rem 0 .45rem; background:#EAF2FD; color:var(--navy)}
.dbadge b{display:block; font-size:1.35rem; font-weight:800; line-height:1.05}
.dbadge span{display:block; font-size:.6rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--blue)}
.up.besok .dbadge{background:linear-gradient(160deg, var(--blue), #3C8DEB); color:#fff; box-shadow:0 .4rem 1rem rgba(26,111,209,.25)}
.up.besok .dbadge span{color:rgba(255,255,255,.85)}
.none{color:var(--muted); padding:1.2rem 0; font-size:1rem}
.statusbox{margin:.5rem 1.2rem 1rem; padding:.55rem .6rem .55rem .9rem; border-radius:1rem; background:var(--soft);
  display:grid; grid-template-columns:auto minmax(0, 1fr); grid-gap:.4rem .6rem; align-items:center}
.statusbox > svg.i{font-size:1.2rem; color:var(--faint)}
.status{font-size:.78rem; color:var(--muted); line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.status.warn{color:#B45F00}

/* ============ Footer: dock INFO ============ */
.ticker{position:relative; margin:0 var(--gutter) .8rem; padding:.4rem; border-radius:1.3rem; color:#fff; overflow:hidden;
  display:grid; grid-template-columns:auto minmax(0, 1fr) auto; align-items:center; grid-gap:1.1rem;
  background:url(topo-gelap.svg) center / cover no-repeat, linear-gradient(100deg, #0B2459, var(--navy) 45%, var(--navy-2));
  box-shadow:0 1rem 2.4rem rgba(14,42,102,.28), inset 0 1px 0 rgba(255,255,255,.12)}
.lbl{display:grid; grid-auto-flow:column; align-items:center; grid-gap:.65rem; padding:.3rem 1.1rem .3rem .3rem; border-radius:2rem;
  background:linear-gradient(135deg, #FFB547, var(--orange)); color:var(--navy);
  font-size:.95rem; font-weight:800; letter-spacing:.14em; box-shadow:0 .4rem 1rem rgba(243,146,0,.35)}
.lbl .ik{display:grid; place-items:center; width:2rem; height:2rem; border-radius:50%; background:var(--navy); color:#fff; font-size:1.15rem}
.lbl::after{content:""; width:.5rem; height:.5rem; border-radius:50%; background:var(--navy); animation:pulse 1.6s ease-in-out infinite}
.track{overflow:hidden; white-space:nowrap;
  -webkit-mask-image:linear-gradient(90deg, transparent, #000 2.5rem, #000 calc(100% - 3rem), transparent);
  mask-image:linear-gradient(90deg, transparent, #000 2.5rem, #000 calc(100% - 3rem), transparent)}
.track span{display:inline-block; white-space:nowrap; padding-left:100%; font-size:1.1rem; font-weight:600; letter-spacing:.01em;
  animation:scroll var(--dur, 40s) linear infinite}
.track .sep{display:inline-block; width:.5rem; height:.5rem; margin:0 1.8rem; transform:rotate(45deg); border-radius:.1rem;
  background:var(--cyan); vertical-align:.15em; box-shadow:0 0 .6rem rgba(53,180,240,.8)}
@keyframes scroll{to{transform:translateX(-100%)}}
.foot{display:grid; grid-auto-flow:column; align-items:center; grid-gap:1.1rem; padding:.45rem 1.3rem; border-radius:2rem;
  background:rgba(255,255,255,.08); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.foot .org{display:grid; grid-auto-flow:column; align-items:center; grid-gap:.5rem; font-size:.85rem; font-weight:700; letter-spacing:.04em;
  padding-right:1.1rem; border-right:1px solid rgba(255,255,255,.2); color:rgba(255,255,255,.85)}
.foot .org svg.i{font-size:1.15rem; color:var(--cyan)}
.foot .moto{font-style:italic; font-weight:700; font-size:.95rem}
.foot .moto::after{content:""; display:block; height:.16rem; margin-top:.25rem; border-radius:1rem;
  background:linear-gradient(90deg, var(--cyan), var(--blue) 60%, var(--orange))}

body.drag::after{content:"Lepaskan file Excel di sini"; position:fixed; top:1.5rem; right:1.5rem; bottom:1.5rem; left:1.5rem; display:grid; place-items:center;
  border:3px dashed var(--blue); border-radius:1.2rem; background:rgba(238,244,252,.94); color:var(--blue);
  font-weight:800; font-size:2.6rem}

/* ============ Tema gelap (untuk TV yang memaksa mode gelap): alamat ?tema=gelap ============ */
html.gelap{color-scheme:dark;
  --bg:#0A1430; --card:#12203F; --soft:#172A4D; --line:#22375F;
  --text:#E6EDFA; --muted:#9FB2D8; --faint:#6477A3; --blue:#4C9BF2;
  --live-bg:#0F3A2E; --live-line:#1C5C47; --next-bg:#12305C; --next-line:#1F4A85;
  --shadow:0 .1rem .25rem rgba(0,0,0,.25), 0 .8rem 2rem rgba(0,0,0,.3)}
html.gelap body{background:
    url(bg-globe-biru.png) 58% -9rem / 22rem no-repeat,
    radial-gradient(ellipse 45% 30% at 62% 0%, rgba(53,180,240,.16), transparent 70%),
    radial-gradient(ellipse 40% 40% at 0% 100%, rgba(26,111,209,.18), transparent 70%),
    linear-gradient(180deg, #0F1D42 0%, var(--bg) 35%)}
html.gelap h1, html.gelap .sapa b, html.gelap .kal b, html.gelap .time, html.gelap .head h3,
html.gelap .tm b, html.gelap .ti, html.gelap .dbadge{color:#F2F6FF}
html.gelap h1 .brand{color:#5AB0FF}
html.gelap .logos{box-shadow:0 .6rem 1.6rem rgba(0,0,0,.35)}
html.gelap .sapa, html.gelap .kal{background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12)}
html.gelap .time small{background:rgba(255,255,255,.08); color:var(--cyan)}
html.gelap .head > svg.i{background:rgba(53,180,240,.14); color:var(--cyan)}

<script>
/* =====================================================================
   PENGATURAN LAYAR
   Jadwal, pengumuman, dan nama kantor diisi di file jadwal.xlsx.
   Bagian ini hanya mengatur cara tampilnya.
   ===================================================================== */
var CONFIG = {
  // Sumber utama: link Google Sheets (cukup tempel link dari address bar; file harus
  // dibagikan "Siapa saja yang memiliki link"). Kosongkan ("") bila hanya memakai Excel lokal.
  linkGoogleSheets: "https://docs.google.com/spreadsheets/d/1224NAO7jDRbGeQ2Hgc9HW0bY-kid8mU5/edit?gid=568623202",
  fileExcel: "", // versi hosting: tanpa file Excel cadangan (data hanya dari Google Sheets)
  // Tema: "terang", "gelap", atau "otomatis" (ikut pengaturan perangkat).
  // Bisa juga per layar lewat alamat, mis. http://192.168.3.233:8000/?tema=gelap
  tema: "terang",
  cekExcelDetik: 120,       // seberapa sering layar membaca ulang Excel
  barisPerHalaman: 4,       // jumlah kegiatan per halaman di timeline "Hari ini"
  detikPerHalaman: 12,
  detikSorotan: 8,          // jeda ganti slide di kartu kiri bila ada beberapa kegiatan sekaligus      // jeda ganti halaman bila sesi lebih banyak
  hariMendatang: 7,         // rentang hari untuk kotak angka "7 hari ke depan"
  jumlahMendatang: 6,       // jumlah kegiatan di kolom "Jadwal mendatang"
  muatUlangMenit: 60,       // halaman memuat ulang penuh sesekali
  // dipakai hanya bila sheet Pengaturan / Pengumuman di Excel kosong
  namaKantor: "Badan Informasi Geospasial",
  lokasi: "Pusat Pengembangan Kompetensi Informasi Geospasial",
  pengumuman: ["Agenda kegiatan PPKIG diperbarui otomatis."]
};

/* Tema: ?tema=... di alamat mengalahkan CONFIG.tema */
(function(){
  var m = location.search.match(/[?&]tema=(gelap|terang|otomatis)/i), t = (m ? m[1] : CONFIG.tema || "terang").toLowerCase();
  var gelap = t === "gelap" || (t === "otomatis" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  if (gelap) document.documentElement.className += " gelap";
  var meta = document.querySelector('meta[name="color-scheme"]');
  if (meta) meta.setAttribute("content", gelap ? "dark" : "only light");
})();

/* Warna penanda tiap kategori (boleh ditambah) */
var WARNA_KATEGORI = {
  "Teknis": "#7CC0F0", "Fungsional": "#6FD3C1", "Manajerial": "#F2B441",
  "Sosial Kultural": "#B99AF0", "Rapat": "#F08A5D",
  "Pelatihan": "#1FA2E6", "Batas Waktu": "#F39200", "Libur": "#E0637A", "Kegiatan": "#1A6FD1"
};

/* Bila Excel tidak punya kolom Kategori, kategori ditebak dari nama acara */
var TEBAK_KATEGORI = [
  ["Batas Waktu", /batas (waktu|akhir)|deadline|paling lambat/i],
  ["Libur", /tanggal merah|libur|cuti bersama/i],
  ["Pelatihan", /pelatihan|latsar|diklat|bimtek|workshop|kelas/i],
  ["Rapat", /rapat|rapim|koordinasi|pembahasan|monev|mentoring|diskusi|evaluasi|finalisasi/i]
];

/* =====================================================================
   Mesin tampilan — tidak perlu diubah
   ===================================================================== */
function pad(n){ return (n < 10 ? "0" : "") + n; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function ymd(y, m, d){ return y + "-" + pad(m) + "-" + pad(d); }
function tgl(offset){
  var d = new Date(); d.setDate(d.getDate() + offset);
  return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate());
}
function toDate(tanggal, jam){
  var p = tanggal.split("-"), j = jam.split(":");
  return new Date(+p[0], +p[1] - 1, +p[2], +j[0], +j[1]);
}
function durasi(ms){
  var m = Math.max(1, Math.round(ms / 60000));
  if (m < 60) return m + " menit";
  var h = Math.floor(m / 60), r = m % 60;
  return h + " jam" + (r ? " " + r + " menit" : "");
}
var fmtTanggal = new Intl.DateTimeFormat("id-ID", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
var fmtHari = new Intl.DateTimeFormat("id-ID", { weekday:"long" });
var fmtTglPendek = new Intl.DateTimeFormat("id-ID", { day:"numeric", month:"short" });

var sesi = [], halaman = 0;
var pesanKosong = "Belum ada kegiatan yang dijadwalkan.";
var MODE_FILE = location.protocol === "file:";

/* ---------- Membaca Excel ---------- */
var BULAN = { jan:1, feb:2, mar:3, apr:4, mei:5, may:5, jun:6, jul:7, agu:8, ags:8, aug:8,
  sep:9, okt:10, oct:10, nov:11, des:12, dec:12 };
/* tahun: tahun agenda dari nama sheet (mis. "Agenda Tahun 2026"); dipakai untuk
   tanggal tanpa tahun ("2 Januari") dan untuk tanggal yang tahunnya salah ketik */
function bacaTanggal(v, tahun){
  if (v === "" || v == null) return null;
  if (typeof v === "number"){ // nomor seri tanggal Excel
    var d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5);
    return ymd(tahun || d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  var s = String(v).trim(), m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return ymd(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){ // 05/10/2026 = 5 Oktober
    var y = +m[3]; if (y < 100) y += 2000;
    return ymd(y, +m[2], +m[1]);
  }
  if ((m = s.match(/^(\d{1,2})\s+([a-z]{3})[a-z]*\.?(?:\s+(\d{4}))?/i)) && BULAN[m[2].toLowerCase()]) // 2 Januari [2026]
    return ymd(m[3] ? +m[3] : (tahun || new Date().getFullYear()), BULAN[m[2].toLowerCase()], +m[1]);
  return null;
}
/* Kolom "Pukul" berisi teks: "13.00 - 15.00", "09.00 WIB s.d. selesai", "8.00-10.30" */
function bacaRentang(v){
  if (typeof v === "number"){ var j = bacaJam(v); return j ? { mulai: j, selesai: null } : null; }
  var s = String(v == null ? "" : v).trim();
  if (!/^\d/.test(s)) return null;
  var re = /(\d{1,2})\s*[.:]\s*(\d{2})/g, jam = [], m;
  while ((m = re.exec(s.slice(0, 40))) && jam.length < 2)
    if (+m[1] < 24 && +m[2] < 60) jam.push(pad(+m[1]) + ":" + m[2]);
  if (!jam.length){ var a = bacaJam(s); return a ? { mulai: a, selesai: null } : null; }
  return { mulai: jam[0], selesai: jam[1] || null };
}
function rapikan(s){ return String(s == null ? "" : s).replace(/\s+/g, " ").trim(); }
function tebakKategori(judul){
  for (var i = 0; i < TEBAK_KATEGORI.length; i++) if (TEBAK_KATEGORI[i][1].test(judul)) return TEBAK_KATEGORI[i][0];
  return "Kegiatan";
}
function bacaJam(v){
  if (v === "" || v == null) return null;
  if (typeof v === "number"){
    if (v >= 1 && v < 24 && v === Math.floor(v)) return pad(v) + ":00"; // ditulis 8 → 08:00
    var menit = Math.round((v - Math.floor(v)) * 1440) % 1440;
    return pad(Math.floor(menit / 60)) + ":" + pad(menit % 60);
  }
  var m = String(v).trim().match(/^(\d{1,2})(?:[:.](\d{2}))?/);
  if (!m || +m[1] > 23) return null;
  return pad(+m[1]) + ":" + (m[2] || "00");
}
function tambahMenit(jam, menit){
  var p = jam.split(":"), t = Math.min(1439, (+p[0]) * 60 + (+p[1]) + menit);
  return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
}
function cariSheet(wb, nama, sebagian){
  for (var i = 0; i < wb.SheetNames.length; i++){
    var n = wb.SheetNames[i].toLowerCase().trim();
    if (n === nama || (sebagian && n.indexOf(nama) > -1)) return wb.SheetNames[i];
  }
  return null;
}
function cariKolom(header, kata){
  for (var i = 0; i < header.length; i++){
    var h = String(header[i]).toLowerCase();
    for (var k = 0; k < kata.length; k++) if (h.indexOf(kata[k]) > -1) return i;
  }
  return -1;
}
function barisSheet(wb, nama){
  return XLSX.utils.sheet_to_json(wb.Sheets[nama], { header: 1, raw: true, defval: "" });
}
function bacaWorkbook(buf){
  if (!window.XLSX) throw new Error("file xlsx.full.min.js tidak ada di folder");
  var wb = XLSX.read(new Uint8Array(buf), { type: "array" });
  var nama = cariSheet(wb, "jadwal") || cariSheet(wb, "agenda", true) || wb.SheetNames[0];
  var rows = barisSheet(wb, nama), hi = -1, r;
  for (r = 0; r < Math.min(rows.length, 15); r++)
    if (cariKolom(rows[r], ["tanggal", "tgl"]) > -1){ hi = r; break; }
  if (hi < 0) throw new Error('kolom "Tanggal" tidak ditemukan di sheet ' + nama);
  var mt = nama.match(/\b(20\d\d)\b/), tahun = mt ? +mt[1] : null;
  var H = rows[hi], col = {
    tanggal:  cariKolom(H, ["tanggal", "tgl"]),
    mulai:    cariKolom(H, ["mulai", "start", "pukul", "jam", "waktu"]),
    selesai:  cariKolom(H, ["selesai", "sampai", "end"]),
    judul:    cariKolom(H, ["judul", "acara", "pelatihan", "materi", "topik"]),
    kategori: cariKolom(H, ["kategori", "jenis"]),
    trainer:  cariKolom(H, ["pengajar", "trainer", "widyaiswara", "pemateri", "instruktur", "narasumber", "fasilitator"]),
    unit:     cariKolom(H, ["lembaga", "unit", "penyelenggara"]),
    ruang:    cariKolom(H, ["ruang", "lokasi", "tempat"]),
    peserta:  cariKolom(H, ["peserta", "target"])
  };
  if (col.judul < 0) throw new Error('kolom "Acara" atau "Judul Kegiatan" tidak ditemukan');

  var hasil = [], lewati = [], tglAktif = null;
  for (r = hi + 1; r < rows.length; r++){
    var row = rows[r];
    var ambil = function(c){ return c < 0 || row[c] == null ? "" : rapikan(row[c]); };
    if (!row.some(function(x){ return String(x).trim() !== ""; })) continue;
    // Tanggal yang di-merge hanya terisi di baris pertama: baris kosong ikut tanggal di atasnya
    var sel = col.tanggal < 0 ? "" : row[col.tanggal];
    var t = String(sel).trim() === "" ? tglAktif : bacaTanggal(sel, tahun);
    if (String(sel).trim() !== "") tglAktif = t;
    var rentang = col.mulai < 0 ? null : bacaRentang(row[col.mulai]);
    var judul = ambil(col.judul);
    // Kegiatan sehari penuh ditulis langsung di kolom Pukul (sel di-merge sampai kolom Tempat)
    if (!judul && !rentang && col.mulai > -1) judul = ambil(col.mulai);
    if (!judul) continue;
    if (!t){ lewati.push(r + 1); continue; }
    var s = { tanggal: t, judul: judul, kategori: ambil(col.kategori) || tebakKategori(judul),
      trainer: ambil(col.trainer), unit: ambil(col.unit), peserta: ambil(col.peserta),
      ruang: String(col.ruang < 0 || row[col.ruang] == null ? "" : row[col.ruang]).trim().split(/\n/)[0].trim() };
    if (rentang){
      var b = col.selesai < 0 ? null : bacaJam(row[col.selesai]);
      b = b || rentang.selesai;
      s.mulai = rentang.mulai;
      if (b && b > s.mulai){ s.selesai = b; s.sampai = b; }
      else { s.selesai = tambahMenit(s.mulai, 120); s.sampai = "selesai"; }
    } else {
      s.seharian = true; s.mulai = "00:00"; s.selesai = "23:59"; s.sampai = "";
    }
    hasil.push(s);
  }

  var personil = bacaPersonil(wb);
  hasil.forEach(function(s){ s.trainer = gantiKode(s.trainer, personil); s.peserta = gantiKode(s.peserta, personil); });

  var info = { lewati: lewati };
  var sp = cariSheet(wb, "pengumuman");
  if (sp){
    info.pengumuman = barisSheet(wb, sp).map(function(x){ return String(x[0]).trim(); })
      .filter(function(x, i){ return x && !(i === 0 && /^pengumuman/i.test(x)); });
  }
  var sg = cariSheet(wb, "pengaturan");
  if (sg){
    barisSheet(wb, sg).forEach(function(x){
      var k = String(x[0]).toLowerCase(), v = String(x[1] == null ? "" : x[1]).trim();
      if (!v) return;
      if (k.indexOf("nama") > -1) info.namaKantor = v;
      else if (k.indexOf("lokasi") > -1) info.lokasi = v;
    });
  }
  return { sesi: hasil, info: info };
}

/* Sheet Personil: Kode Nama → "Gelar Depan Nama, Gelar Belakang" */
function bacaPersonil(wb){
  var peta = {}, nama = cariSheet(wb, "personil") || cariSheet(wb, "personil", true);
  if (!nama) return peta;
  var rows = barisSheet(wb, nama), hi = -1, r;
  for (r = 0; r < Math.min(rows.length, 15); r++)
    if (cariKolom(rows[r], ["kode"]) > -1){ hi = r; break; }
  if (hi < 0) return peta;
  var H = rows[hi].map(function(h){ return String(h).toLowerCase(); });
  var cKode = cariKolom(H, ["kode"]), cNama = -1;
  H.forEach(function(h, i){ if (cNama < 0 && h.indexOf("nama") > -1 && h.indexOf("kode") < 0) cNama = i; });
  var cDepan = cariKolom(H, ["depan"]), cBelakang = cariKolom(H, ["belakang"]);
  if (cNama < 0) return peta;
  for (r = hi + 1; r < rows.length; r++){
    var kode = String(rows[r][cKode]).trim().toUpperCase(), nm = String(rows[r][cNama]).trim();
    if (!kode || !nm) continue;
    var depan = cDepan < 0 ? "" : String(rows[r][cDepan]).trim();
    var belakang = cBelakang < 0 ? "" : String(rows[r][cBelakang]).trim().replace(/^[\s.,]+/, "");
    if (belakang === "-") belakang = "";
    peta[kode] = (depan ? depan + " " : "") + nm + (belakang ? ", " + belakang : "");
  }
  return peta;
}
function gantiKode(teks, personil){
  if (!teks) return teks;
  var bagian = teks.split(/\s*[,;\/&+]\s*/).filter(Boolean);
  var semuaKode = bagian.length && bagian.every(function(k){ return personil[k.toUpperCase()]; });
  if (!semuaKode) return teks; // pengajar tamu: tampil apa adanya
  return bagian.map(function(k){ return personil[k.toUpperCase()]; }).join(" · ");
}

function setTicker(list){

  tk.setAttribute("data-isi", kunci);

function jamSekarang(){ var n = new Date(); return pad(n.getHours()) + ":" + pad(n.getMinutes()); }
function terapkan(data, sumber, waktu){
  sesi = data.sesi.map(function(s){
    return Object.assign({}, s, { a: toDate(s.tanggal, s.mulai), b: toDate(s.tanggal, s.selesai) });
  }).sort(function(x, y){ return x.a - y.a || x.b - y.b; });
  var info = data.info || {};
  document.getElementById("kantor").textContent = info.namaKantor || CONFIG.namaKantor;
  document.getElementById("lokasi").textContent = info.lokasi || CONFIG.lokasi;
  setTicker(info.pengumuman && info.pengumuman.length ? info.pengumuman : CONFIG.pengumuman);
  var msg = sesi.length.toLocaleString("id-ID") + " kegiatan" + (/^Google Sheets$/.test(sumber) ? " · Google Sheets" : "") +
    " · diperbarui " + (waktu || jamSekarang());
  document.getElementById("status").title = "Sumber: " + sumber;
  if (info.lewati && info.lewati.length)
    setStatus(msg + " · Baris Excel tidak terbaca (cek tanggal/jam/judul): " + info.lewati.slice(0, 8).join(", "), true);
  else setStatus(msg, false);

/* Link Google Sheets apa pun (edit/view/share) → alamat unduh .xlsx */
function urlGoogleSheets(link){
  var m = String(link || "").match(/\/d\/([\w-]{20,})/);
  return m ? "https://docs.google.com/spreadsheets/d/" + m[1] + "/export?format=xlsx" : "";
}
function ambilWorkbook(url){
  return fetch(url, { cache: "no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.arrayBuffer();
  }).then(bacaWorkbook);
}
function muatExcel(){
  if (!window.fetch) return;
  var gs = urlGoogleSheets(CONFIG.linkGoogleSheets);
  var lokal = function(alasan){
    if (MODE_FILE || !CONFIG.fileExcel) throw new Error(alasan || "file Excel cadangan tidak diatur");
    return ambilWorkbook(encodeURIComponent(CONFIG.fileExcel) + "?t=" + Date.now())
      .then(function(data){ return { data: data, sumber: CONFIG.fileExcel + (alasan ? " (Google Sheets gagal: " + alasan + ")" : "") }; });
  };
  var jalan = gs
    ? ambilWorkbook(gs + "&t=" + Date.now()).then(function(data){ return { data: data, sumber: "Google Sheets" }; },
        function(e){ return lokal(e.message); })
    : (MODE_FILE ? Promise.reject(new Error("mode tanpa server")) : lokal(""));
  jalan.then(function(h){ simpan(h.data); terapkan(h.data, h.sumber); })
    .catch(function(e){
      if (MODE_FILE) setStatus("Google Sheets hanya terbaca bila layar dibuka lewat “Jalankan Layar Jadwal.bat”. Atau seret file Excel agenda ke layar ini.", true);
      else setStatus("Gagal membaca jadwal: " + e.message + ". Layar menampilkan jadwal terakhir yang berhasil dibaca.", true);
    });
}
function bukaFile(file){
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try { var data = bacaWorkbook(fr.result); simpan(data); terapkan(data, file.name); }
    catch (e) { setStatus("File " + file.name + " tidak bisa dibaca: " + e.message, true); }
  };
  fr.readAsArrayBuffer(file);
}

function render(){

  var live = today.filter(function(s){ return statusOf(s, now) === "live"; });

var sorotan = null, idxSorot = 0, kunciSorot = "";
function renderSorotan(){

  var box = document.getElementById("now"), f = document.getElementById("feature");
  var d = sorotan.daftar, n = d.length, now = new Date(), key = tgl(0), html;
  if (!n){

    return;
  }
  idxSorot = idxSorot % n;
  var s = d[idxSorot], urut = n > 1 ? " · " + (idxSorot + 1) + "/" + n : "";
  var titik = n > 1 ? '<span class="sdots">' + d.map(function(_, i){ return '<i class="' + (i === idxSorot ? "on" : "") + '"></i>'; }).join("") + '</span>' : "";
  if (sorotan.mode === "live"){
    var pasti = !s.seharian && s.sampai !== "selesai";
    box.className = "now";
    html = '<div class="shd"><span class="tag live">Sedang berlangsung' + urut + '</span>' + titik + '</div>' +
      '<div class="fjam">' + esc(jamLabel(s)) + '<small>' +
      (s.seharian ? "Sepanjang hari" : pasti ? "Sisa " + durasi(s.b - now) : "Sampai selesai") + '</small></div>' +

      '<h2>' + esc(s.judul) + '</h2>' + metaHtml(s);
  } else {
    var isToday = s.tanggal === key;
    box.className = "now is-next";
    html = '<div class="shd"><span class="tag next">Berikutnya' + (isToday ? "" : " · " + labelHari(s.tanggal)) + urut + '</span>' + titik + '</div>' +
      '<div class="fjam">' + esc(jamLabel(s)) + '<small>' +
      (isToday ? "Mulai " + durasi(s.a - now) + " lagi" : fmtTanggal.format(s.a)) + '</small></div>' +
      '<h2>' + esc(s.judul) + '</h2>' + metaHtml(s);
  }
  f.innerHTML = html;
  var k = sorotan.mode + "|" + s.tanggal + s.mulai + "|" + s.judul;
  if (k !== kunciSorot){ // animasi hanya saat slide berganti

  }
}

});

/* Layar penuh, layar tetap menyala, kursor disembunyikan saat diam */
document.addEventListener("dblclick", function(){ // klik dua kali = layar penuh (atau tekan F11)
  var el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!document.fullscreenElement && req){ var p = req.call(el); if (p && p.catch) p.catch(function(){}); }
});
function kunciLayar(){
  if (navigator.wakeLock && navigator.wakeLock.request) navigator.wakeLock.request("screen").catch(function(){});
}
kunciLayar();
document.addEventListener("visibilitychange", function(){ if (!document.hidden) kunciLayar(); });
var idleT;
function aktif(){ document.body.classList.remove("idle"); clearTimeout(idleT);
  idleT = setTimeout(function(){ document.body.classList.add("idle"); }, 3000); }
document.addEventListener("mousemove", aktif); aktif();
</script>
